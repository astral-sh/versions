name: Sync NDJSON to R2

on:
  push:
    branches:
      - main
    paths:
      - "v1/**.ndjson"

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Upload NDJSON files to R2
        uses: astral-sh/github-actions/upload-r2@46d9685eed35b39a3d83a8dde3a3b4e1bff97a8a # 2026.11.19.0
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MIRROR_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MIRROR_R2_SECRET_ACCESS_KEY }}
        with:
          account-id: ${{ secrets.MIRROR_R2_CLOUDFLARE_ACCOUNT_ID }}
          bucket: ${{ secrets.MIRROR_R2_BUCKET_NAME }}
          source-directory: v1
          include: "*.ndjson"
          prefix: github/versions/main/v1
          if-exists: overwrite
          cache-control: public, max-age=300
          content-type: application/x-ndjson
